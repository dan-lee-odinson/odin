# The runs the Director has set aside by ruling: each kept as evidence, listed by S8 as a build defect with the
# ruling's reason, and not scored (eval/results.py, set_aside). A run S8 already finds to be a build defect by its
# own checks (RUN_END ERROR, U59; a lost turn) needs no entry here.
# A scenario entry (scope: scenario) sets a whole scenario aside from the tallies by ruling. Keyed by the scenario,
# not a run, it changes no run's score and stops no series: its runs stay scored as S8 scored them, and the results
# table (eval/results.py, summarize and totals) marks their rows "set aside by ruling" and leaves them out of its totals.
