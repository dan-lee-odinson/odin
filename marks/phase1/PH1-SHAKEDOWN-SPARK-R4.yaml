      1. How to talk to INST: Commands `INST COLLECT with TYPE value, DURATION value, OPCODE value, TEMP value`.
      Telemetry `INST HEALTH_STATUS <ITEM>`; `INST LATEST <ITEM>` for single-item latest only. Names upper-case
      with underscores, no __, [[, ]], whitespace, no trailing _.

