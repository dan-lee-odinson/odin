script:
  latch_up:
    onset_met_s: 12140
    in_transit:
    - 11740
    - 12540
    how: 'the wrapper sets HUGINN''s stuck-load term (its EPS definitions'' stuck_load power_w, 2.0 W, the step
      of PASS-3: the load current up by 0.4 A) at onset, and clears it when PLD_STATE turns OFF. The load then falls
      back to its base, and turning the payload on again does not bring it back. If the payload is already OFF at
      onset, no latch-up occurs, and the truth file says so.'
    damage:
      after_s: 120
      met_s: 12260
      when: the payload is still ON at that MET of simulation time
      clock: simulation time, which the onboard seat's pause and charge advances
      recorded: in the truth file; the simulator models no damaged payload afterwards
feeds:
  disclosure: Modeled from the simulator's true state and this script, and disclosed as modeled (contract section
    6.5). The space weather is real data, replayed, and labeled replayed.
  delivery: Each report is a turn trigger (contract section 6.1), merged as usual with any others waiting. Reports
    reach ODIN in contact only, in the ground seat. None is delivered in the silent pre-roll (U46), and out of contact
    the onboard seat gets none; a report falling there is not held.
  station_receiver:
    states: 'LOCKED with its signal level while the own station hears the spacecraft; NO_SIGNAL at the noise floor
      otherwise. FAULT is never reported: a failed receiver chain shows as NO_SIGNAL (the document, section 5, selection
      4).'
    reports: one at each change of state, and one at each MET in contact that is a multiple of 60
    content:
      status: LOCKED or NO_SIGNAL
      signal_level_dbm: a number, to 0.1 dB
    signal_level_dbm: -90.0 + 20 log10(1000 km / slant range), from HUGINN's look angles at that MET; -130.0, the
      noise floor, with NO_SIGNAL
    receiver_failed: false
