# Model settings for scored runs, read by Muse Code's loop (CONTRACT.md §11.1, §11.3). Nothing in odin/
# hard-codes them. The names are those of the MODEL_CALL record (§16.5 U17): reasoning_effort is sent
# explicitly on every call, never the provider's default; max_output_tokens counts reasoning tokens as
# well as the answer's; timeout_s is per call. Every setting carries its source and the date it was set.
# The Director picked each model's level from M3's measurement table (MC-M3-01's DEPOSIT.md; the run
# was runs/m3-2026-10-27/ in Muse Code's workspace).

spark:
  model: muse-spark-1.3
  reasoning_effort: high
  max_output_tokens: 32000
  timeout_s: 120
  source: the Director's ruling of 27 October 2026, from M3's table
  date: 2026-10-27

spark_open:
  model: meta-models/muse-spark-open-1026
  reasoning_effort: xhigh
  max_output_tokens: 32000
  timeout_s: 120
  source: the Director's ruling of 27 October 2026, from M3's table
  date: 2026-10-27

# Muse Glimmer on Modal, the onboard seat (CONTRACT.md §11.1; the Director's ruling of 29 October 2026, item 5, since
# glimmer_local missed 60 s a decision on the laptop in M5). Its adapter reads the endpoint from this block (M16).
glimmer_modal:
  model: Muse-Glimmer-30B-KQuant-17GB-Q4_K_M.gguf
  reasoning_effort: low
  max_output_tokens: 8192
  timeout_s: 60
  endpoint: https://dan-lee-odinson--odin-glimmer-serve-h100.us-east.modal.run
  gpu: H100
  source: the Director's ruling and approval of 30 October 2026 ("Low, tie type to command"; "Approve, but a 60 s timeout"), from M5's timing on Modal
  date: 2026-10-30
