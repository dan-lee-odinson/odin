# Model prices read by the spend meter at run time (CONTRACT.md §11.2, §11.3).
# US dollars per million tokens. Every figure carries its source and the date it was taken.
# CONTRACT.md §11.2 states that both providers bill reasoning tokens as output.
# Each model's prices are kept under its configuration name. Its model ID is in config/models.yaml and its
# provider in its adapter (the Director's ruling on U57, 28 October 2026).

spark:
  input_per_mtok: 1.25
  cached_input_per_mtok: 0.15
  output_per_mtok: 4.25
  source: CONTRACT.md v0.5 §11.2, starting values
  date: 2026-10-26

spark_open:
  input_per_mtok: 1.25
  cached_input_per_mtok: 0.15
  output_per_mtok: 4.25
  source: https://www.baseten.co/library/muse-spark-open/ (Model API pricing, per 1M tokens)
  date: 2026-10-26

# Muse Voice Transcribe, for Muse Code's M6 (the Director's ruling of 29 October 2026, "Per audio hour, Meta stop").
# Billed per hour of audio processed, rounded down to whole seconds, with no minimum (Meta's page). Not a model
# ODIN flies: nothing for it in config/models.yaml.
voice_transcribe:
  model: muse-voice-transcribe-1.0
  per_audio_hour: 0.18
  stop: META
  source: https://dev.meta.ai/docs/speech-to-text
  date: 2026-10-29

# Muse Glimmer on Modal, the onboard seat's fallback (the Director's ruling of 29 October 2026): charged per
# GPU-second of each call's wall time, against the Modal stop. Its model settings wait for M5 (config/models.yaml).
glimmer_modal:
  per_gpu_second: 0.001097
  gpu: H100 SXM5
  stop: MODAL
  source: https://modal.com/pricing
  date: 2026-10-29
