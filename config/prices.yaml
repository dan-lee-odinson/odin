# Model prices read by the spend meter at run time (CONTRACT.md §11.2, §11.3).
# US dollars per million tokens. Every figure carries its source and the date it was taken.
# CONTRACT.md §11.2 states that both providers bill reasoning tokens as output.

spark:
  provider: Meta Model API, Standard mode
  model: muse-spark-1.3
  input_per_mtok: 1.25
  cached_input_per_mtok: 0.15
  output_per_mtok: 4.25
  source: CONTRACT.md v0.5 §11.2, starting values
  date: 2026-10-26

spark_open:
  provider: Baseten Model API (hackathon credit)
  model: meta-models/muse-spark-open-1026
  input_per_mtok: 1.25
  cached_input_per_mtok: 0.15
  output_per_mtok: 4.25
  source: https://www.baseten.co/library/muse-spark-open/ (Model API pricing, per 1M tokens)
  date: 2026-10-26
