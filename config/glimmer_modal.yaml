# Muse Glimmer on Modal, the onboard seat's fallback (CONTRACT.md §11.1; the Director's rulings of 29 October 2026
# and his approval of 30 October 2026): its deployment, as Claude Code deployed it (tools/glimmer_modal.py). Since
# his approval of 30 October 2026, its model settings and this endpoint are in config/models.yaml's frozen block,
# where ODIN's glimmer_modal adapter reads the endpoint (M16); this file is not read by ODIN.
#
# Call POST <endpoint>/v1/chat/completions, OpenAI-compatible, with the headers Modal-Key and Modal-Secret holding
# ODIN_MODAL_PROXY_KEY and ODIN_MODAL_PROXY_SECRET, read from the environment and never written here or anywhere.
# Claude Code warms the server before a run and lets it scale to zero after: the adapter never starts, warms or
# stops it.
endpoint: https://dan-lee-odinson--odin-glimmer-serve-h100.us-east.modal.run
gpu: H100
app: odin-glimmer
function: serve_h100
