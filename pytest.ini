[pytest]
# The repository-wide run, python -m pytest with no paths: the repository's tests, and the tests
# each Muse Code deposit brings in odin/tests (00_HANDOFF.md §5, step 3).
testpaths = tests odin/tests
# deps/ holds HUGINN, used unchanged and never collected; cache/ and runs/ hold data, not tests.
norecursedirs = .* deps cache runs build dist node_modules venv
